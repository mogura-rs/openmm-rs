[package]
name = "openmm-core"
version.workspace = true
edition.workspace = true
license = "MIT AND BSD-3-Clause"

[features]
default = ["ndarray"]
ndarray = ["burn/ndarray", "dep:ndarray"]
wgpu    = ["burn/wgpu"]
cuda    = ["burn/cuda"]

[dependencies]
burn.workspace = true
nalgebra.workspace = true
rayon.workspace = true
uom.workspace = true
# mdtraj-rs.workspace = true  # uncomment when file I/O module is implemented
rustfft = "6"
libm = "0.2"
ndarray = { version = "0.17.2", optional = true }

[dev-dependencies]
approx.workspace = true
